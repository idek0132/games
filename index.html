    function formatGameName(filename) {
        let name = filename.replace(/\.html$/i, '');
        name = name.replace(/[-_]/g, ' ');
        name = name.replace(/%20/g, ' ');
        name = name.replace(/\./g, ' ');
        if (name.toLowerCase() === 'index') {
            return 'index';
        }
        return name;
    }

    function renderGames(filterText) {
        const container = document.getElementById('gamesGrid');
        const counterSpan = document.getElementById('counterDisplay');
        const lowerFilter = filterText.toLowerCase();

        let filtered = gameFiles;
        if (lowerFilter) {
            filtered = gameFiles.filter(function(file) {
                const displayName = formatGameName(file).toLowerCase();
                return displayName.includes(lowerFilter) || file.toLowerCase().includes(lowerFilter);
            });
        }

        counterSpan.innerText = filtered.length + ' / ' + gameFiles.length + ' games';

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results">no games found</div>';
            return;
        }

        let html = '';
        for (let i = 0; i < filtered.length; i++) {
            const file = filtered[i];
            const displayName = formatGameName(file);
            const fullPath = basePath + file;
            html += '<div class="game-card">';
            html += '<a href="' + fullPath + '" class="game-link" target="_top">' + escapeHtml(displayName) + '</a>';
            html += '</div>';
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    const searchInput = document.getElementById('searchInput');
    let debounceTimer;
    searchInput.addEventListener('input', function(e) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            renderGames(e.target.value);
        }, 200);
    });

    renderGames('');
</script>
</body>
</html>
