<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f11;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #eaeef5;
            letter-spacing: -0.3px;
        }

        .toolbar {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            background: #1a1d24;
            border: 1px solid #2c303a;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: #e2e8f0;
            font-size: 0.85rem;
            width: 260px;
            outline: none;
            font-family: inherit;
        }

        .search-box:focus {
            border-color: #4a5b8c;
        }

        .counter {
            font-size: 0.8rem;
            color: #7a7f8f;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .game-card {
            background: #1a1d24;
            border: 1px solid #2a2e38;
            border-radius: 12px;
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            background: #222630;
            border-color: #3d455c;
            transform: translateY(-3px);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f0f11;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .game-card:hover .game-image img {
            transform: scale(1.02);
        }

        .game-link {
            display: block;
            text-decoration: none;
            color: #cbd5e6;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.75rem;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            background: rgba(0, 0, 0, 0.2);
        }

        .game-link:visited {
            color: #9aa3b8;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #6b7280;
            background: #1a1d24;
            border-radius: 12px;
            border: 1px solid #2a2e38;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.75rem;
            }
            .game-link {
                font-size: 0.7rem;
                padding: 0.5rem;
            }
            .search-box {
                width: 100%;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<div class="container">

    function renderGames(filterText) {
        const container = document.getElementById('gamesGrid');
        const counterSpan = document.getElementById('counterDisplay');
        const lowerFilter = filterText.toLowerCase();

        let filtered = gamesData;
        if (lowerFilter) {
            filtered = gamesData.filter(function(game) {
                return game.name.toLowerCase().includes(lowerFilter);
            });
        }

        counterSpan.innerText = filtered.length + ' / ' + gamesData.length + ' games';

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results">No games found</div>';
            return;
        }

        let html = '';
        for (let i = 0; i < filtered.length; i++) {
            const game = filtered[i];
            html += '<div class="game-card">';
            html += '<div class="game-image">';
            html += '<img src="' + game.img + '" alt="' + escapeHtml(game.name) + '" loading="lazy" onerror="this.src=\'/img/placeholder.png\'">';
            html += '</div>';
            html += '<a href="' + game.url + '" class="game-link" target="_top">' + escapeHtml(game.name) + '</a>';
            html += '</div>';
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    const searchInput = document.getElementById('searchInput');
    let debounceTimer;
    searchInput.addEventListener('input', function(e) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            renderGames(e.target.value);
        }, 200);
    });

    renderGames('');
</script>
